<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="650" viewBox="0 0 1120 650" role="img" aria-labelledby="title desc">
<title id="title">Budgeted evidence recall by question type</title>
<desc id="desc">Paired horizontal bars compare baseline and role-aware recall for six question types. The largest gain is single-session user, followed by knowledge update.</desc>
<rect width="1120" height="650" rx="18" fill="#0b1220"/>
<text x="54" y="52" fill="#f8fafc" font-family="Arial,sans-serif" font-size="24" font-weight="700">Recall by question type</text>
<text x="54" y="80" fill="#94a3b8" font-family="Arial,sans-serif" font-size="14">Held-out TEST · grouped bars show baseline vs. role-aware performance</text>
<rect x="750" y="102" width="13" height="13" rx="3" fill="#64748b"/><text x="771" y="114" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="13">Baseline</text>
<rect x="858" y="102" width="13" height="13" rx="3" fill="#38bdf8"/><text x="879" y="114" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="13">Role-aware</text>
<g stroke="#263449" stroke-width="1">
<line x1="350" y1="140" x2="350" y2="550"/><line x1="475" y1="140" x2="475" y2="550"/><line x1="600" y1="140" x2="600" y2="550"/><line x1="725" y1="140" x2="725" y2="550"/><line x1="850" y1="140" x2="850" y2="550"/>
</g>
