<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-labelledby="title desc">
<title id="title">Budgeted evidence recall on the locked test set</title>
<desc id="desc">Baseline recall is 40.42 percent and role-aware recall is 70.94 percent across 235 held-out questions, an increase of 30.52 percentage points.</desc>
<rect width="960" height="430" rx="18" fill="#0b1220"/>
<text x="56" y="54" fill="#f8fafc" font-family="Arial,sans-serif" font-size="24" font-weight="700">10% budgeted evidence recall</text>
<text x="56" y="82" fill="#94a3b8" font-family="Arial,sans-serif" font-size="14">Locked TEST · LongMemEval-S cleaned · n = 235 questions</text>
<g stroke="#263449" stroke-width="1">
<line x1="270" y1="125" x2="270" y2="340"/><line x1="410" y1="125" x2="410" y2="340"/><line x1="550" y1="125" x2="550" y2="340"/><line x1="690" y1="125" x2="690" y2="340"/><line x1="830" y1="125" x2="830" y2="340"/>
</g>
<g fill="#94a3b8" font-family="Arial,sans-serif" font-size="13" text-anchor="middle">
<text x="270" y="365">0%</text><text x="410" y="365">25%</text><text x="550" y="365">50%</text><text x="690" y="365">75%</text><text x="830" y="365">100%</text>
</g>
<g fill="#e2e8f0" font-family="Arial,sans-serif" font-size="16" font-weight="600">
<text x="56" y="184">Baseline</text><text x="56" y="274">Role-aware</text>
</g>
<rect x="270" y="145" width="226.35" height="54" rx="9" fill="#64748b"/>
<rect x="270" y="235" width="397.26" height="54" rx="9" fill="#38bdf8"/>
<g fill="#f8fafc" font-family="Arial,sans-serif" font-size="17" font-weight="700">
<text x="510" y="179">40.42%</text><text x="681" y="269">70.94%</text>
</g>
<rect x="56" y="386" width="848" height="1" fill="#263449"/>
<text x="56" y="411" fill="#7dd3fc" font-family="Arial,sans-serif" font-size="15" font-weight="700">+30.52 percentage points</text>
<text x="904" y="411" fill="#94a3b8" font-family="Arial,sans-serif" font-size="12" text-anchor="end">Paired bootstrap 95% CI for gain: +25.30 to +35.96 pp</text>
</svg>