name: MemWeave artifact validation

on:
  push:
    paths:
      - "MemWeave/results/final_locked_test/**"
      - "MemWeave/results/artifacts/2026-11-26/MemWeave_Research_Artifacts.zip"
      - "MemWeave/scripts/**"
      - "MemWeave/docs/REPRODUCIBILITY_AUDIT.md"
      - ".github/workflows/memweave-artifact-validation.yml"
  pull_request:
    paths:
      - "MemWeave/results/final_locked_test/**"
      - "MemWeave/results/artifacts/2026-11-26/MemWeave_Research_Artifacts.zip"
      - "MemWeave/scripts/**"
      - "MemWeave/docs/REPRODUCIBILITY_AUDIT.md"
      - ".github/workflows/memweave-artifact-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-aggregate-artifacts:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate committed MemWeave aggregate artifacts
        run: python MemWeave/scripts/validate_release.py
      - name: Audit research archive and embedded SHA-256 manifest
        run: python MemWeave/scripts/audit_research_archive.py
      - name: Preserve archive and audit report for independent inspection
        uses: actions/upload-artifact@v4
        with:
          name: memweave-research-archive-audit
          path: |
            MemWeave/results/artifacts/2026-11-26/MemWeave_Research_Artifacts.zip
            archive-audit-output/archive_audit_report.json
          if-no-files-found: error
          retention-days: 2
