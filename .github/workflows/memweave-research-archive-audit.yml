name: MemWeave research archive audit

on:
  pull_request:
    paths:
      - "MemWeave/results/artifacts/2026-11-26/MemWeave_Research_Artifacts.zip"
      - "MemWeave/scripts/audit_research_archive.py"
      - ".github/workflows/memweave-research-archive-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-research-archive:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Audit archive and embedded SHA-256 manifest
        run: python MemWeave/scripts/audit_research_archive.py

      - name: Preserve archive and audit report for independent inspection
        uses: actions/upload-artifact@v4
        with:
          name: memweave-research-archive-audit
          path: |
            MemWeave/results/artifacts/2026-11-26/MemWeave_Research_Artifacts.zip
            archive-audit-output/archive_audit_report.json
          if-no-files-found: error
          retention-days: 2
