name: Deploy MemWeave research website to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "MemWeave/web/**"
      - "index.html"
      - "app.js"
      - "styles.css"
      - ".nojekyll"
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate workspace JavaScript
        run: node --check MemWeave/web/app.js
      - name: Validate research portal JavaScript
        run: |
          node --check site/memory-engine.js
          node --check site/safe-files.js
          node --check site/app.js
          node --check site/research.js
          node --check site/charts.js
      - name: Test research-aligned browser evidence engine
        run: node tests/memory-engine.test.cjs
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static website
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
